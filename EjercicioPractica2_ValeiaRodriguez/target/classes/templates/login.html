<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar Sesión | Sistema Médico</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #1a252f; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; }
        .login-header { background: #2c3e50; border-radius: 10px 10px 0 0; padding: 32px 32px 24px; text-align: center; }
        .login-header .icon { font-size: 48px; color: #3498db; }
        .login-header h1 { color: #fff; font-size: 22px; margin: 8px 0 4px; }
        .login-header p  { color: #95a5a6; font-size: 13px; margin: 0; }
        .login-body { background: #fff; border-radius: 0 0 10px 10px; padding: 28px 32px 32px; }
        .role-pill { display: inline-block; font-size: 11px; padding: 2px 10px;
                     border-radius: 10px; font-weight: 600; color: #fff; }
        .pill-admin    { background: #dc3545; }
        .pill-medico   { background: #198754; }
        .pill-paciente { background: #0d6efd; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg rounded-3 overflow-hidden">

        <!-- Header -->
        <div class="login-header">
            <div class="icon"><i class="bi bi-hospital"></i></div>
            <h1>Sistema Médico</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Body -->
        <div class="login-body">

            <div th:if="${errorMsg}" class="alert alert-danger py-2 small">
                <i class="bi bi-exclamation-circle me-1"></i><span th:text="${errorMsg}"></span>
            </div>
            <div th:if="${logoutMsg}" class="alert alert-success py-2 small">
                <i class="bi bi-check-circle me-1"></i><span th:text="${logoutMsg}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold small">
                        <i class="bi bi-envelope me-1"></i>Correo electrónico
                    </label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="tucorreo@email.com" required autofocus/>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small">
                        <i class="bi bi-lock me-1"></i>Contraseña
                    </label>
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="••••••••" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </form>

            <!-- Info de roles -->
            <hr class="my-4"/>
            <p class="text-muted small text-center mb-2">Acceso según rol:</p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <span class="role-pill pill-admin">
                    <i class="bi bi-person-gear me-1"></i>ADMIN
                </span>
                <span class="role-pill pill-medico">
                    <i class="bi bi-heart-pulse me-1"></i>MEDICO
                </span>
                <span class="role-pill pill-paciente">
                    <i class="bi bi-person me-1"></i>PACIENTE
                </span>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
