<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Editar Usuario')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-pencil-square me-2 text-warning"></i>Editar Usuario</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/usuarios/{id}/editar(id=${usuario.id})}"
                          th:object="${usuario}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre"
                                   th:field="*{nombre}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email"
                                   th:field="*{email}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">
                                Contraseña <small class="text-muted">(dejar vacío para no cambiar)</small>
                            </label>
                            <input type="password" class="form-control" id="password"
                                   th:field="*{password}" placeholder="Nueva contraseña (opcional)"/>
                        </div>
                        <div class="mb-4">
                            <label for="role" class="form-label fw-semibold">Rol</label>
                            <select class="form-select" id="role" th:field="*{role}">
                                <option th:each="rol : ${roles}"
                                        th:value="${rol.id}"
                                        th:text="${rol.nombre}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save me-1"></i>Actualizar
                            </button>
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
