<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Roles')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h1 class="h3 mb-0"><i class="bi bi-shield-check me-2 text-danger"></i>Gestión de Roles</h1>
            <p class="text-muted small mb-0">Roles disponibles: ADMIN, MEDICO, PACIENTE</p>
        </div>
        <a th:href="@{/roles/nuevo}" class="btn btn-danger">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Rol
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Usuarios asignados</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles}">
                        <td th:text="${role.id}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="'badge-' + ${role.nombre}"
                                  th:text="${role.nombre}"></span>
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${role.usuarios != null ? role.usuarios.size() : 0} + ' usuarios'">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/roles/{id}(id=${role.id})}"
                               class="btn btn-sm btn-outline-secondary me-1" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/roles/{id}/editar(id=${role.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/roles/{id}/eliminar(id=${role.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('¿Eliminar este rol?')" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>No hay roles registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
