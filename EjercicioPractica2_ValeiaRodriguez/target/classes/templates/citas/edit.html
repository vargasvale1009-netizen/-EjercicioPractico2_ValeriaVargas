<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Editar Cita')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-calendar2-week me-2 text-warning"></i>Editar Cita Médica</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/citas/{id}/editar(id=${cita.id})}"
                          th:object="${cita}" method="post">
                        <div class="mb-3">
                            <label for="nombrePaciente" class="form-label fw-semibold">Nombre del Paciente</label>
                            <input type="text" class="form-control" id="nombrePaciente"
                                   th:field="*{nombrePaciente}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="especialidad" class="form-label fw-semibold">Especialidad</label>
                            <input type="text" class="form-control" id="especialidad"
                                   th:field="*{especialidad}" required/>
                        </div>
                        <div class="mb-3">
                            <label for="fechaCita" class="form-label fw-semibold">Fecha y Hora</label>
                            <input type="datetime-local" class="form-control" id="fechaCita"
                                   name="fechaCita"
                                   th:value="${#temporals.format(cita.fechaCita,'yyyy-MM-dd''T''HH:mm')}"
                                   required/>
                        </div>
                        <div class="mb-3">
                            <label for="costo" class="form-label fw-semibold">Costo ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="costo"
                                       th:field="*{costo}" min="0" step="0.01" required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="activa" class="form-label fw-semibold">Estado</label>
                            <select class="form-select" id="activa" th:field="*{activa}">
                                <option value="true"  th:selected="${cita.activa == true}">Activa</option>
                                <option value="false" th:selected="${cita.activa == false}">Inactiva</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save me-1"></i>Actualizar Cita
                            </button>
                            <a th:href="@{/citas}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
