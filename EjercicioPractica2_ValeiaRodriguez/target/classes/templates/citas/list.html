<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head('Citas Médicas')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h1 class="h3 mb-0"><i class="bi bi-calendar2-heart me-2 text-success"></i>Gestión de Citas Médicas</h1>
            <p class="text-muted small mb-0">Listado completo de citas del sistema</p>
        </div>
        <a th:href="@{/citas/nueva}" class="btn btn-success"
           sec:authorize="hasAnyRole('ADMIN','MEDICO')">
            <i class="bi bi-plus-circle me-1"></i>Nueva Cita
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Paciente</th>
                        <th>Especialidad</th>
                        <th>Fecha</th>
                        <th>Costo</th>
                        <th>Estado</th>
                        <th sec:authorize="hasAnyRole('ADMIN','MEDICO')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.id}"></td>
                        <td><i class="bi bi-person me-1 text-muted"></i><span th:text="${cita.nombrePaciente}"></span></td>
                        <td><span class="badge bg-info text-dark" th:text="${cita.especialidad}"></span></td>
                        <td>
                            <i class="bi bi-calendar2 me-1 text-muted"></i>
                            <span th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td class="fw-semibold text-success"
                            th:text="'$' + ${#numbers.formatDecimal(cita.costo, 1, 2)}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cita.activa} ? 'badge-activa' : 'badge-inactiva'"
                                  th:text="${cita.activa} ? 'Activa' : 'Inactiva'"></span>
                        </td>
                        <td sec:authorize="hasAnyRole('ADMIN','MEDICO')">
                            <a th:href="@{/citas/{id}(id=${cita.id})}"
                               class="btn btn-sm btn-outline-secondary me-1" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/citas/{id}/editar(id=${cita.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/citas/{id}/estado(id=${cita.id})}"
                                  method="post" class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm me-1"
                                        th:classappend="${cita.activa} ? 'btn-outline-warning' : 'btn-outline-success'"
                                        th:title="${cita.activa} ? 'Desactivar' : 'Activar'">
                                    <i class="bi"
                                       th:classappend="${cita.activa} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                </button>
                            </form>
                            <form th:action="@{/citas/{id}/eliminar(id=${cita.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('¿Eliminar esta cita?')" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-calendar-x fs-4 d-block mb-2"></i>No hay citas registradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
