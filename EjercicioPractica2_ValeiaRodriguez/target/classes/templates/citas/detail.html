<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Detalle de Cita')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-calendar2-check me-2 text-secondary"></i>Detalle de Cita Médica</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header fw-semibold bg-light">
                    Cita médica #<span th:text="${cita.id}"></span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-muted">Nombre del Paciente</dt>
                        <dd class="col-sm-7" th:text="${cita.nombrePaciente}"></dd>

                        <dt class="col-sm-5 text-muted">Especialidad</dt>
                        <dd class="col-sm-7">
                            <span class="badge bg-info text-dark" th:text="${cita.especialidad}"></span>
                        </dd>

                        <dt class="col-sm-5 text-muted">Fecha de la Cita</dt>
                        <dd class="col-sm-7"
                            th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy HH:mm')}"></dd>

                        <dt class="col-sm-5 text-muted">Costo</dt>
                        <dd class="col-sm-7 fw-semibold text-success"
                            th:text="'$' + ${#numbers.formatDecimal(cita.costo, 1, 2)}"></dd>

                        <dt class="col-sm-5 text-muted">Estado</dt>
                        <dd class="col-sm-7">
                            <span class="badge"
                                  th:classappend="${cita.activa} ? 'badge-activa' : 'badge-inactiva'"
                                  th:text="${cita.activa} ? 'Activa' : 'Inactiva'"></span>
                        </dd>
                    </dl>
                </div>
                <div class="card-footer d-flex gap-2">
                    <a th:href="@{/citas/{id}/editar(id=${cita.id})}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                    <form th:action="@{/citas/{id}/estado(id=${cita.id})}" method="post">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${cita.activa} ? 'btn-outline-warning' : 'btn-outline-success'"
                                th:text="${cita.activa} ? 'Desactivar' : 'Activar'"></button>
                    </form>
                    <a th:href="@{/citas}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
