<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Acceso Denegado | Sistema Médico</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f8f9fa; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="text-center p-5" style="max-width:480px;">
        <div class="mb-4" style="font-size:80px; color:#dc3545;">
            <i class="bi bi-shield-x"></i>
        </div>
        <h1 class="h2 fw-bold text-danger mb-3">Acceso Denegado</h1>
        <p class="text-muted mb-4">
            No tienes permisos para acceder a esta sección.<br/>
            Contacta al administrador si crees que es un error.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Ir al Inicio
            </a>
            <a th:href="@{/citas}" class="btn btn-outline-secondary">
                <i class="bi bi-calendar2-heart me-1"></i>Ver Citas
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
