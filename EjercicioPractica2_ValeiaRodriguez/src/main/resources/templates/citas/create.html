<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Nueva Cita')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-calendar2-plus me-2 text-success"></i>Nueva Cita Médica</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/citas/nueva}" th:object="${cita}" method="post">
                        <div class="mb-3">
                            <label for="nombrePaciente" class="form-label fw-semibold">Nombre del Paciente</label>
                            <input type="text" class="form-control" id="nombrePaciente"
                                   th:field="*{nombrePaciente}" placeholder="Nombre completo" required/>
                        </div>
                        <div class="mb-3">
                            <label for="especialidad" class="form-label fw-semibold">Especialidad</label>
                            <input type="text" class="form-control" id="especialidad"
                                   th:field="*{especialidad}" placeholder="Ej: Cardiología, Pediatría..." required/>
                        </div>
                        <div class="mb-3">
                            <label for="fechaCita" class="form-label fw-semibold">Fecha y Hora de la Cita</label>
                            <input type="datetime-local" class="form-control" id="fechaCita"
                                   name="fechaCita" required/>
                        </div>
                        <div class="mb-3">
                            <label for="costo" class="form-label fw-semibold">Costo ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="costo"
                                       th:field="*{costo}" min="0" step="0.01" placeholder="0.00" required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="activa" class="form-label fw-semibold">Estado</label>
                            <select class="form-select" id="activa" th:field="*{activa}">
                                <option value="true">Activa</option>
                                <option value="false">Inactiva</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save me-1"></i>Guardar Cita
                            </button>
                            <a th:href="@{/citas}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
