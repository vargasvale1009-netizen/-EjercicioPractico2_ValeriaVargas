<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Detalle de Usuario')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-person-circle me-2 text-secondary"></i>Detalle de Usuario</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header fw-semibold bg-light">
                    Información del usuario #<span th:text="${usuario.id}"></span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted">Nombre</dt>
                        <dd class="col-sm-8" th:text="${usuario.nombre}"></dd>

                        <dt class="col-sm-4 text-muted">Email</dt>
                        <dd class="col-sm-8" th:text="${usuario.email}"></dd>

                        <dt class="col-sm-4 text-muted">Rol</dt>
                        <dd class="col-sm-8">
                            <span th:if="${usuario.role != null}"
                                  class="badge"
                                  th:classappend="'badge-' + ${usuario.role.nombre}"
                                  th:text="${usuario.role.nombre}"></span>
                            <span th:if="${usuario.role == null}" class="text-muted">Sin rol</span>
                        </dd>
                    </dl>
                </div>
                <div class="card-footer d-flex gap-2">
                    <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
