<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <!-- Page header -->
    <div class="page-header d-flex align-items-center gap-2 mb-4">
        <i class="bi bi-house-heart fs-3 text-primary"></i>
        <div>
            <h1 class="h3 mb-0">Bienvenido al Sistema Médico</h1>
            <p class="text-muted mb-0 small">Panel de control principal</p>
        </div>
    </div>

    <!-- Tarjetas de estadísticas -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-people-fill fs-2 text-primary"></i>
                    </div>
                    <div>
                        <div class="fs-2 fw-bold text-primary" th:text="${totalUsuarios}">0</div>
                        <div class="text-muted small">Usuarios registrados</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/usuarios}" class="btn btn-sm btn-outline-primary w-100">
                        <i class="bi bi-arrow-right me-1"></i>Gestionar
                    </a>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-shield-check fs-2 text-danger"></i>
                    </div>
                    <div>
                        <div class="fs-2 fw-bold text-danger" th:text="${totalRoles}">0</div>
                        <div class="text-muted small">Roles en el sistema</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/roles}" class="btn btn-sm btn-outline-danger w-100">
                        <i class="bi bi-arrow-right me-1"></i>Gestionar
                    </a>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-calendar2-heart fs-2 text-success"></i>
                    </div>
                    <div>
                        <div class="fs-2 fw-bold text-success" th:text="${totalCitas}">0</div>
                        <div class="text-muted small">Total de citas</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/citas}" class="btn btn-sm btn-outline-success w-100">
                        <i class="bi bi-arrow-right me-1"></i>Ver citas
                    </a>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-calendar2-check fs-2 text-warning"></i>
                    </div>
                    <div>
                        <div class="fs-2 fw-bold text-warning" th:text="${citasActivas}">0</div>
                        <div class="text-muted small">Citas activas</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/consultas/por-estado?activa=true}"
                       class="btn btn-sm btn-outline-warning w-100">
                        <i class="bi bi-arrow-right me-1"></i>Ver activas
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Accesos rápidos -->
    <div class="row g-3">
        <div class="col-12">
            <div class="card">
                <div class="card-header fw-semibold">
                    <i class="bi bi-lightning-charge me-2 text-warning"></i>Accesos Rápidos
                </div>
                <div class="card-body d-flex flex-wrap gap-2">
                    <a th:href="@{/citas/nueva}" class="btn btn-success"
                       sec:authorize="hasAnyRole('ADMIN','MEDICO')">
                        <i class="bi bi-plus-circle me-1"></i>Nueva Cita
                    </a>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary"
                       sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-person-plus me-1"></i>Nuevo Usuario
                    </a>
                    <a th:href="@{/consultas}" class="btn btn-outline-secondary">
                        <i class="bi bi-search me-1"></i>Consultas Avanzadas
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
