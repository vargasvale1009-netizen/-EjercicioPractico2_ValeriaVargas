<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Detalle de Rol')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-shield me-2 text-secondary"></i>Detalle del Rol</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header fw-semibold bg-light">
                    Información del rol #<span th:text="${role.id}"></span>
                </div>
                <div class="card-body">
                    <dl class="row mb-3">
                        <dt class="col-sm-4 text-muted">ID</dt>
                        <dd class="col-sm-8" th:text="${role.id}"></dd>

                        <dt class="col-sm-4 text-muted">Nombre</dt>
                        <dd class="col-sm-8">
                            <span class="badge"
                                  th:classappend="'badge-' + ${role.nombre}"
                                  th:text="${role.nombre}"></span>
                        </dd>

                        <dt class="col-sm-4 text-muted">Usuarios</dt>
                        <dd class="col-sm-8">
                            <span class="badge bg-secondary"
                                  th:text="${role.usuarios != null ? role.usuarios.size() : 0} + ' asignados'">
                            </span>
                        </dd>
                    </dl>

                    <!-- Lista de usuarios -->
                    <div th:if="${role.usuarios != null and !role.usuarios.isEmpty()}">
                        <p class="fw-semibold small text-muted mb-2">Usuarios con este rol:</p>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item py-1 small"
                                th:each="u : ${role.usuarios}"
                                th:text="${u.nombre + ' — ' + u.email}"></li>
                        </ul>
                    </div>
                    <p th:if="${role.usuarios == null or role.usuarios.isEmpty()}"
                       class="text-muted small mb-0">Sin usuarios asignados.</p>
                </div>
                <div class="card-footer d-flex gap-2">
                    <a th:href="@{/roles/{id}/editar(id=${role.id})}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                    <a th:href="@{/roles}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
