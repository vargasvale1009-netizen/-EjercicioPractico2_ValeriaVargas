<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Nuevo Rol')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">

    <div class="page-header">
        <h1 class="h3 mb-0"><i class="bi bi-plus-circle me-2 text-danger"></i>Crear Nuevo Rol</h1>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/roles/nuevo}" th:object="${role}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del Rol</label>
                            <input type="text" class="form-control text-uppercase" id="nombre"
                                   th:field="*{nombre}" placeholder="Ej: ADMIN, MEDICO, PACIENTE" required/>
                            <div class="form-text">Roles del sistema: ADMIN, MEDICO, PACIENTE</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/roles}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
