<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' | Sistema Médico'">Sistema Médico</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .sidebar-title { font-size: 11px; text-transform: uppercase;
                         letter-spacing: 1px; color: #6c757d; padding: 0 .75rem; }
        .footer { background: #2c3e50; color: #adb5bd; font-size: 13px; }
        .footer a { color: #adb5bd; text-decoration: none; }
        .footer a:hover { color: #fff; }
        .page-header { border-bottom: 2px solid #dee2e6; margin-bottom: 1.5rem; padding-bottom: .75rem; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .table thead th { background: #343a40; color: #fff; border-color: #495057; }
        .badge-activa   { background-color: #198754 !important; }
        .badge-inactiva { background-color: #6c757d !important; }
        .badge-ADMIN    { background-color: #dc3545 !important; }
        .badge-MEDICO   { background-color: #198754 !important; }
        .badge-PACIENTE { background-color: #0d6efd !important; }
    </style>
</head>

<!-- ═══════════════════════════ NAVBAR FRAGMENT ═══════════════════════════ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-hospital me-2"></i>Sistema Médico
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house me-1"></i>Inicio
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">
                        <i class="bi bi-people me-1"></i>Usuarios
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/roles}">
                        <i class="bi bi-shield-check me-1"></i>Roles
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MEDICO','PACIENTE')">
                    <a class="nav-link" th:href="@{/citas}">
                        <i class="bi bi-calendar2-heart me-1"></i>Citas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MEDICO','PACIENTE')">
                    <a class="nav-link" th:href="@{/consultas}">
                        <i class="bi bi-search me-1"></i>Consultas
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <span class="navbar-text text-warning">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Usuario</span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ═══════════════════════════ FOOTER FRAGMENT ═══════════════════════════ -->
<footer th:fragment="footer" class="footer mt-auto py-3">
    <div class="container-fluid px-4">
        <div class="row align-items-center">
            <div class="col-md-6">
                <i class="bi bi-hospital me-1"></i>
                <strong class="text-white">Sistema Médico</strong> &copy; 2025
            </div>
            <div class="col-md-6 text-md-end">
                <span>Desarrollado con Spring Boot + Thymeleaf + Bootstrap 5</span>
            </div>
        </div>
    </div>
</footer>

<!-- ═════════════════ LAYOUT PRINCIPAL (page fragment) ═══════════════════ -->
<html th:fragment="layout(titulo, contenido)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="flex-grow-1 py-4">
        <div class="container-fluid px-4">
            <th:block th:replace="${contenido}"/>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
